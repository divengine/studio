name: 'Divengine Code Source'
type: module
description: 'Local Git repositories of a Development: refs indexed from the Git object database, a code browser, and MCP tools so agents can read the code. Code stays in Git; Studio keeps only the structure.'
core_version_requirement: ^11
package: 'Divengine'
configure: divengine_source.settings
dependencies:
  - divengine_core
  - divengine_process
  - divengine_traceability
