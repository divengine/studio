divengine.admin:
  path: '/admin/divengine'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Divengine Studio'
  requirements:
    _permission: 'access divengine'

divengine_core.home:
  path: '/studio'
  defaults:
    _controller: '\Drupal\divengine_core\Controller\HomeController::home'
    _title: 'Divengine Studio'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
