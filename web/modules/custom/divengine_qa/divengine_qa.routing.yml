divengine_qa.admin:
  path: '/admin/divengine/qa'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Test management'
  requirements:
    _permission: 'administer qa'

divengine_qa.run_action:
  path: '/qa/run/{qa_test_run}/do/{action}'
  defaults:
    _controller: '\Drupal\divengine_qa\Controller\QaActionController::run'
  requirements:
    _entity_access: 'qa_test_run.view'
    _permission: 'execute qa tests+manage qa+administer qa'
    action: 'start|complete|cancel|reset|generate'
    _csrf_token: 'TRUE'
  options:
    parameters:
      qa_test_run:
        type: 'entity:qa_test_run'

divengine_qa.pass:
  path: '/qa/pass/{type}/{id}'
  defaults:
    _controller: '\Drupal\divengine_qa\Controller\QaActionController::pass'
  requirements:
    _custom_access: '\Drupal\divengine_qa\Controller\QaActionController::recordAccess'
    type: 'step|execution'
    id: '\d+'
    _csrf_token: 'TRUE'

divengine_qa.record_result:
  path: '/qa/record/{type}/{id}'
  defaults:
    _form: '\Drupal\divengine_qa\Form\RecordResultForm'
    _title: 'Record QA Result'
  requirements:
    _custom_access: '\Drupal\divengine_qa\Controller\QaActionController::recordAccess'
    type: 'step|execution'
    id: '\d+'

divengine_qa.add_evidence:
  path: '/qa/evidence/{type}/{id}'
  defaults:
    _form: '\Drupal\divengine_qa\Form\AddEvidenceForm'
    _title: 'Add evidence'
  requirements:
    _custom_access: '\Drupal\divengine_qa\Controller\QaActionController::recordAccess'
    type: 'step|execution'
    id: '\d+'

divengine_qa.navigate:
  path: '/qa/execution/{qa_test_execution}/go/{direction}'
  defaults:
    _controller: '\Drupal\divengine_qa\Controller\QaActionController::navigate'
  requirements:
    _entity_access: 'qa_test_execution.view'
    direction: 'previous|next|pending'
  options:
    parameters:
      qa_test_execution:
        type: 'entity:qa_test_execution'

divengine_qa.skip_case:
  path: '/qa/execution/{qa_test_execution}/skip'
  defaults:
    _form: '\Drupal\divengine_qa\Form\SkipCaseForm'
    _title: 'Skip Test Case'
  requirements:
    _entity_access: 'qa_test_execution.view'
    _permission: 'execute qa tests+manage qa+administer qa'
  options:
    parameters:
      qa_test_execution:
        type: 'entity:qa_test_execution'

divengine_qa.promote_scenario:
  path: '/qa/execution/{qa_test_execution}/promote'
  defaults:
    _form: '\Drupal\divengine_qa\Form\PromoteScenarioForm'
    _title: 'Promote to Test Case'
  requirements:
    _entity_access: 'qa_test_execution.view'
    _permission: 'manage qa+administer qa'
  options:
    parameters:
      qa_test_execution:
        type: 'entity:qa_test_execution'

divengine_qa.add_scenario:
  path: '/qa/run/{qa_test_run}/scenario'
  defaults:
    _form: '\Drupal\divengine_qa\Form\AddScenarioForm'
    _title: 'Add Scenario'
  requirements:
    _entity_access: 'qa_test_run.view'
    _permission: 'execute qa tests+manage qa+administer qa'
  options:
    parameters:
      qa_test_run:
        type: 'entity:qa_test_run'

divengine_qa.reopen_run:
  path: '/qa/run/{qa_test_run}/reopen'
  defaults:
    _form: '\Drupal\divengine_qa\Form\ReopenRunForm'
    _title: 'Reopen Test Run'
  requirements:
    _entity_access: 'qa_test_run.view'
    _permission: 'administer qa'
  options:
    parameters:
      qa_test_run:
        type: 'entity:qa_test_run'

divengine_qa.reassign_run:
  path: '/qa/run/{qa_test_run}/reassign'
  defaults:
    _form: '\Drupal\divengine_qa\Form\ReassignRunForm'
    _title: 'Reassign Test Run'
  requirements:
    _entity_access: 'qa_test_run.view'
    _permission: 'manage qa+administer qa'
