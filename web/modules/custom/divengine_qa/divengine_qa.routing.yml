  path: '/development/{development}/quality'
  defaults:
    _controller: '\Drupal\divengine_qa\Controller\QaPagesController::development'
    _title_callback: '\Drupal\divengine_qa\Controller\QaPagesController::developmentTitle'
  requirements:
    _entity_access: 'development.view'
    _permission: 'use qa+execute qa tests+manage qa+administer qa'
  options:
    parameters:
      development:
        type: 'entity:development'

divengine_qa.plans:
  path: '/qa/plans'
  defaults:
    _controller: '\Drupal\divengine_qa\Controller\QaPagesController::plans'
    _title: 'Test plans'
  requirements:
    _permission: 'use qa+execute qa tests+manage qa+administer qa'

divengine_qa.my_runs:
  path: '/qa/my-runs'
  defaults:
