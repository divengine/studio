  defaults:
    _controller: '\Drupal\divengine_qa\Controller\QaReportController::plan'
    _title: 'Test Plan report'
  requirements:
    _entity_access: 'qa_test_plan.view'
  options:
    parameters:
      qa_test_plan:
        type: 'entity:qa_test_plan'

divengine_qa.report_run:
  path: '/qa/run/{qa_test_run}/report'
  defaults:
    _controller: '\Drupal\divengine_qa\Controller\QaReportController::run'
    _title: 'Test Run report'
