divengine_qa.environment.*:
  type: config_entity
  label: 'Test environment'
  mapping:
    id:
      type: machine_name
      label: 'Code'
    label:
      type: required_label
      label: 'Environment'
    description:
      type: text
      label: 'Description'
    weight:
      type: weight
      label: 'Order'
    default_test_url:
      type: string
      label: 'Default Test URL'

