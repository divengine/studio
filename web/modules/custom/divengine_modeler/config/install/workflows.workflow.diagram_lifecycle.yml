langcode: en
status: true
dependencies:
  module:
    - content_moderation
    - divengine_modeler
id: diagram_lifecycle
label: 'Diagram lifecycle'
type: content_moderation
type_settings:
  states:
    draft:
      label: Draft
      weight: -5
      published: false
      default_revision: false
    review:
      label: 'In review'
      weight: -2
      published: false
      default_revision: false
    published:
      label: Approved
      weight: 0
      published: true
      default_revision: true
    archived:
      label: Deprecated
      weight: 5
      published: false
      default_revision: true
  transitions:
    create_new_draft:
      label: 'Create new draft'
      from:
        - draft
        - published
      to: draft
      weight: 0
    submit_for_review:
      label: 'Submit for review'
      from:
        - draft
      to: review
      weight: 1
    request_changes:
      label: 'Request changes'
      from:
        - review
      to: draft
      weight: 2
    approve:
      label: Approve
      from:
        - review
      to: published
      weight: 3
    deprecate:
      label: Deprecate
      from:
        - published
      to: archived
      weight: 4
    restore:
      label: 'Restore to draft'
      from:
        - archived
      to: draft
      weight: 5
  entity_types: {  }
  default_moderation_state: draft
