divengine_external.link:
  path: '/external/link/{entity_type_id}/{entity_id}'
  defaults:
    _form: '\Drupal\divengine_external\Form\LinkExternalWorkForm'
    _title: 'Link external work'
  requirements:
    _custom_access: '\Drupal\divengine_external\Form\LinkExternalWorkForm::access'
    entity_type_id: '[a-z_][a-z0-9_]*'
    entity_id: \d+

# The default collection route asks for the administration permission; the
# list itself only shows references of Developments the viewer sees.
entity.external_reference.collection:
  path: '/external'
  defaults:
    _entity_list: 'external_reference'
    _title: 'External work'
  requirements:
    _permission: 'use unified process'

divengine_external.refresh:
  path: '/external/{external_reference}/refresh'
  defaults:
    _controller: '\Drupal\divengine_external\Controller\ExternalReferenceController::refresh'
  requirements:
    _entity_access: 'external_reference.update'
    _csrf_token: 'TRUE'
    external_reference: \d+
  options:
    parameters:
      external_reference:
        type: 'entity:external_reference'

divengine_external.settings:
  path: '/admin/divengine/external'
  defaults:
    _form: '\Drupal\divengine_external\Form\ExternalSettingsForm'
    _title: 'External references'
  requirements:
    _permission: 'administer external references'
