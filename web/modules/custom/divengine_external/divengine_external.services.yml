services:
  plugin.manager.divengine_external_provider:
    class: Drupal\divengine_external\ExternalProviderManager
    parent: default_plugin_manager
  divengine_external.references:
    class: Drupal\divengine_external\ExternalReferences
    arguments: ['@plugin.manager.divengine_external_provider', '@entity_type.manager', '@divengine_process.development_references', '@lock', '@database']
  divengine_external.observations:
    class: Drupal\divengine_external\ExternalObservations
    arguments: ['@database', '@plugin.manager.divengine_external_provider', '@config.factory', '@state', '@datetime.time', '@cache_tags.invalidator']
