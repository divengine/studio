services:
  divengine_timesheet.stats:
    class: Drupal\divengine_timesheet\TimesheetStats
    arguments: ['@database']
  divengine_timesheet.timer:
    class: Drupal\divengine_timesheet\Timer
    arguments: ['@user.data', '@datetime.time']
  divengine_timesheet.view:
    class: Drupal\divengine_timesheet\TimesheetView
    arguments: ['@entity_type.manager', '@current_user', '@divengine_timesheet.stats', '@divengine_timesheet.timer', '@divengine_project.visibility', '@form_builder', '@date.formatter']
