langcode: en
status: true
dependencies:
  config:
  - divengine_artifact.artifact_type.work_product
  module:
  - content_moderation
  - divengine_artifact
id: work_product_lifecycle
label: Work product lifecycle
type: content_moderation
type_settings:
  states:
    draft:
      label: Draft
      weight: -10
      published: false
      default_revision: false
    in_review:
      label: In review
      weight: 0
      published: false
      default_revision: false
    published:
      label: Baselined
      weight: 5
      published: true
      default_revision: true
  transitions:
    draft:
      label: Back to draft
      from:
      - draft
      - in_review
      - published
      to: draft
      weight: 0
    submit:
      label: Submit for review
      from:
      - draft
      - in_review
      to: in_review
      weight: 1
    baseline:
      label: Baseline
      from:
      - in_review
      to: published
      weight: 2
  entity_types:
    artifact:
    - work_product
  default_moderation_state: draft
