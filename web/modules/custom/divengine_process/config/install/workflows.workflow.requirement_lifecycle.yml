langcode: en
status: true
dependencies:
  config:
  - divengine_artifact.artifact_type.business_rule
  - divengine_artifact.artifact_type.requirement
  module:
  - content_moderation
  - divengine_artifact
id: requirement_lifecycle
label: Requirement lifecycle
type: content_moderation
type_settings:
  states:
    draft:
      label: Draft
      weight: -10
      published: false
      default_revision: false
    proposed:
      label: Proposed
      weight: -5
      published: false
      default_revision: false
    approved:
      label: Approved
      weight: 0
      published: false
      default_revision: false
    published:
      label: Baselined
      weight: 5
      published: true
      default_revision: true
    deprecated:
      label: Deprecated
      weight: 10
      published: false
      default_revision: true
  transitions:
    draft:
      label: Draft
      from:
      - draft
      - proposed
      - approved
      - published
      - deprecated
      to: draft
      weight: 0
    propose:
      label: Propose
      from:
      - draft
      - proposed
      to: proposed
      weight: 1
    approve:
      label: Approve
      from:
      - proposed
      - approved
      to: approved
      weight: 2
    baseline:
      label: Baseline
      from:
      - approved
      to: published
      weight: 3
    deprecate:
      label: Deprecate
      from:
      - draft
      - proposed
      - approved
      - published
      to: deprecated
      weight: 4
  entity_types:
    artifact:
    - business_rule
    - requirement
  default_moderation_state: draft
