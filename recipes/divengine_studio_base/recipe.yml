name: 'Divengine Studio base'
description: 'All Divengine Studio modules and their configuration, for a site that already has what the Standard recipe provides (text formats, editors, roles). Re-apply it to update an existing Studio site after deploying new code.'
type: 'Divengine Studio'
# Core's site recipe is not a dependency here: its configuration changes
# between Drupal releases and is compared strictly, so re-applying it on a
# site created with an earlier release fails. recipes/divengine_studio
# combines it with this recipe for new sites.
install:
  # Core extensions whose configuration the actions below change. A Standard
  # site has them already; they are listed so that the recipe validates on
  # its own.
  - node
  - filter
  - editor
  - ckeditor5
  - workflows
  - content_moderation
  - link
  - divengine_core
  - divengine_artifact
  - divengine_knowledge
  - divengine_traceability
  - divengine_modeler
  - divengine_modeler_bpmn
  - divengine_modeler_uml
  - divengine_diagram_embed
  - divengine_process
  - divengine_qa
  - divengine_project
  - divengine_timesheet
  - divengine_thread
  - divengine_articles
  - divengine_source
  - divengine_database
  - divengine_codedocs
  # Analyzers push database snapshots with HTTP Basic (only on routes that
  # accept it).
  - basic_auth
  - gin
  - divengine_studio_theme
config:
  # Re-applying the recipe to an existing site keeps the configuration the
  # site already has instead of refusing because it was customized.
  strict: false
  # Recipes only install simple config from modules; config entities
  # (artifact and diagram types, workflows, trace link types, vocabularies,
  # views) have to be imported explicitly.
  import:
    divengine_artifact: '*'
    divengine_knowledge: '*'
    divengine_traceability: '*'
    divengine_modeler: '*'
    divengine_modeler_bpmn: '*'
    divengine_modeler_uml: '*'
    divengine_diagram_embed: '*'
    divengine_process: '*'
    divengine_qa: '*'
    divengine_project: '*'
    divengine_articles: '*'
    divengine_core: '*'
    divengine_studio_theme: '*'
    # Optional configuration of core and contributed extensions is not
    # created when a recipe installs them; import what Studio relies on.
    content_moderation:
      - views.view.moderated_content
    # Since Drupal 11.4 the Standard recipe has no content types, so nothing
    # imports Node's view modes and bulk actions for Studio's knowledge
    # articles; the body field storage is in this recipe's config directory.
    node:
      - core.entity_view_mode.node.full
      - core.entity_view_mode.node.rss
      - core.entity_view_mode.node.teaser
      - system.action.node_delete_action
      - system.action.node_make_sticky_action
      - system.action.node_make_unsticky_action
      - system.action.node_promote_action
      - system.action.node_publish_action
      - system.action.node_save_action
      - system.action.node_unpromote_action
      - system.action.node_unpublish_action
    file:
      - views.view.files
    gin:
      - block.block.gin_breadcrumbs
      - block.block.gin_content
      - block.block.gin_help
      - block.block.gin_local_actions
      - block.block.gin_messages
      - block.block.gin_page_title
      - block.block.gin_primary_local_tasks
      - block.block.gin_secondary_local_tasks
  actions:
    system.theme:
      simpleConfigUpdate:
        admin: gin
        default: divengine_studio_theme
    # Diagram types arrive as synced config, which skips the hook that
    # attaches them to the diagram lifecycle; attach them here.
    workflows.workflow.diagram_lifecycle:
      addDiagramTypes: '*'
    # Articles are written in the Studio theme, like every other record.
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: false
    # The site name is the operator's: the installation profile suggests
    # "Divengine Studio", and applying the recipe keeps an existing name.
    system.site:
      simpleConfigUpdate:
        page.front: /studio
    # The filter goes first: the CKEditor 5 "Diagram" button requires it.
    filter.format.basic_html:
      setFilterConfigs:
        - instance_id: filter_html
          configuration:
            id: filter_html
            provider: filter
            status: true
            weight: -10
            settings:
              allowed_html: '<br> <p> <h2 id> <h3 id> <h4 id> <h5 id> <h6 id> <cite> <dl> <dt> <dd> <a hreflang href> <blockquote cite> <ul type> <ol start type> <strong> <em> <code> <li> <img src alt data-entity-uuid data-entity-type height width data-caption data-align> <drupal-diagram data-diagram-uuid data-align>'
              filter_html_help: false
              filter_html_nofollow: false
        - instance_id: divengine_diagram_embed
          configuration:
            id: divengine_diagram_embed
            provider: divengine_diagram_embed
            status: true
            weight: 100
            settings: {}
        - instance_id: divengine_record_references
          configuration:
            id: divengine_record_references
            provider: divengine_traceability
            status: true
            weight: 90
            settings: {}
    filter.format.full_html:
      setFilterConfigs:
        - instance_id: divengine_diagram_embed
          configuration:
            id: divengine_diagram_embed
            provider: divengine_diagram_embed
            status: true
            weight: 100
            settings: {}
        - instance_id: divengine_record_references
          configuration:
            id: divengine_record_references
            provider: divengine_traceability
            status: true
            weight: 90
            settings: {}
    filter.format.qa_issue:
      setFilterConfig:
        instance_id: divengine_record_references
        configuration:
          id: divengine_record_references
          provider: divengine_traceability
          status: true
          weight: 90
          settings: {}
    editor.editor.basic_html:
      addItemToToolbar: divengineDiagram
    editor.editor.full_html:
      addItemToToolbar: divengineDiagram
    user.role.content_editor:
      grantPermissions:
        - 'access divengine'
        - 'view divengine reports'
        - 'use unified process'
        - 'view artifact'
        - 'create artifact'
        - 'edit artifact'
        - 'view artifact revisions'
        - 'view diagrams'
        - 'create diagrams'
        - 'edit own diagrams'
        - 'view diagram revisions'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'view trace link revisions'
        - 'use artifact_lifecycle transition create_new_draft'
        - 'use artifact_lifecycle transition submit_for_review'
        - 'use diagram_lifecycle transition create_new_draft'
        - 'use diagram_lifecycle transition submit_for_review'
        - 'view latest version'
        - 'use requirement_lifecycle transition draft'
        - 'use requirement_lifecycle transition propose'
        - 'use requirement_lifecycle transition approve'
        - 'use requirement_lifecycle transition baseline'
        - 'use requirement_lifecycle transition deprecate'
        - 'use use_case_lifecycle transition identify'
        - 'use use_case_lifecycle transition outline'
        - 'use use_case_lifecycle transition detail'
        - 'use use_case_lifecycle transition review'
        - 'use use_case_lifecycle transition baseline'
        - 'use use_case_lifecycle transition deprecate'
        - 'use work_product_lifecycle transition draft'
        - 'use work_product_lifecycle transition submit'
        - 'use work_product_lifecycle transition baseline'
        - 'use projects'
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'log time'
        - 'create knowledge_article content'
        - 'edit any knowledge_article content'
        - 'delete own knowledge_article content'
        - 'view knowledge_article revisions'
        - 'revert knowledge_article revisions'
        - 'use source code'
        - 'use database schemas'
        - 'use code docs'
        - 'use qa'
    # Verification criteria of divengine_qa, after the cases are imported.
    divengine_process.development_case.standard:
      addLines: &qa_lines
        - element_type: readiness
          target: requirements_verified
          milestone_type: initial_operational_capability
          level: recommended
        - element_type: readiness
          target: use_cases_verified
          milestone_type: product_release
          level: recommended
        - element_type: readiness
          target: change_requests_evidenced
          level: recommended
    divengine_process.development_case.brownfield:
      addLines: *qa_lines
    # Test management roles, cumulative like their permissions.
    user.role.qa_user:
      createIfNotExists:
        label: 'QA User'
      grantPermissions:
        - 'access comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'use qa'
    user.role.qa_tester:
      createIfNotExists:
        label: 'QA Tester'
      grantPermissions:
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'use qa'
        - 'execute qa tests'
        - 'use text format qa_issue'
    user.role.qa_lead:
      createIfNotExists:
        label: 'QA Lead'
      grantPermissions:
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'use qa'
        - 'execute qa tests'
        - 'manage qa'
        - 'use text format qa_issue'
    user.role.qa_manager:
      createIfNotExists:
        label: 'QA Manager'
      grantPermissions:
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'use qa'
        - 'execute qa tests'
        - 'manage qa'
        - 'administer qa'
        - 'use text format qa_issue'
    # Project management: content editors work on tasks (above); project
    # managers create projects and manage any project they see.
    user.role.project_manager:
      createIfNotExists:
        label: 'Project Manager'
      grantPermissions:
        - 'access divengine'
        - 'use projects'
        - 'manage projects'
        - 'log time'
        - 'manage timesheets'
        - 'use source code'
        - 'use database schemas'
        - 'use code docs'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
    # Database analyzer: a service account for CI that only pushes schema
    # snapshots (it must be a member of the Developments it feeds).
    user.role.database_analyzer:
      createIfNotExists:
        label: 'Database analyzer'
      grantPermissions:
        - 'import database snapshots'
    user.role.code_docs_publisher:
      createIfNotExists:
        label: 'Code docs publisher'
      grantPermissions:
        - 'publish code docs'
    # Studio Manager: everything in Studio's business logic (records,
    # process, QA, projects, timesheets, knowledge and their configuration),
    # without Drupal site administration nor the administration theme.
    user.role.studio_manager:
      createIfNotExists:
        label: 'Studio Manager'
      grantPermissions:
