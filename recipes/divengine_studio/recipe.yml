name: 'Divengine Studio'
description: 'Engineering suite on Drupal core: artifacts, traceability, knowledge and diagram modelers (BPMN, UML), with diagrams embeddable in formatted text.'
type: 'Site'
# New sites: Drupal's Standard recipe, then everything Studio adds. Existing
# Studio sites are updated with recipes/divengine_studio_base alone.
recipes:
  - core/recipes/standard
  - divengine_studio_base
