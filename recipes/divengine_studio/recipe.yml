name: 'Divengine Studio'
description: 'Engineering suite on Drupal core: artifacts, traceability, knowledge and diagram modelers (BPMN, UML), with diagrams embeddable in formatted text.'
type: 'Site'
recipes:
  - core/recipes/standard
install:
  - workflows
  - content_moderation
  - link
  - divengine_core
  - divengine_artifact
  - divengine_knowledge
  - divengine_traceability
  - divengine_modeler
  - divengine_modeler_bpmn
  - divengine_modeler_uml
  - divengine_diagram_embed
  - divengine_process
  - divengine_qa
  - divengine_project
  - divengine_timesheet
  - divengine_thread
  - gin
  - divengine_studio_theme
config:
  # Re-applying the recipe to an existing site keeps the configuration the
  # site already has instead of refusing because it was customized.
  strict: false
  # Recipes only install simple config from modules; config entities
  # (artifact and diagram types, workflows, trace link types, vocabularies,
  # views) have to be imported explicitly.
  import:
    divengine_artifact: '*'
    divengine_knowledge: '*'
    divengine_traceability: '*'
    divengine_modeler: '*'
    divengine_modeler_bpmn: '*'
    divengine_modeler_uml: '*'
    divengine_diagram_embed: '*'
    divengine_process: '*'
    divengine_qa: '*'
    divengine_project: '*'
    divengine_core: '*'
    divengine_studio_theme: '*'
  actions:
    system.theme:
      simpleConfigUpdate:
        admin: gin
        default: divengine_studio_theme
    # Diagram types arrive as synced config, which skips the hook that
    # attaches them to the diagram lifecycle; attach them here.
    workflows.workflow.diagram_lifecycle:
      addDiagramTypes: '*'
    system.site:
      simpleConfigUpdate:
        name: 'Divengine Studio'
        page.front: /studio
    # The filter goes first: the CKEditor 5 "Diagram" button requires it.
    filter.format.basic_html:
      setFilterConfigs:
        - instance_id: filter_html
          configuration:
            id: filter_html
            provider: filter
            status: true
            weight: -10
            settings:
              allowed_html: '<br> <p> <h2 id> <h3 id> <h4 id> <h5 id> <h6 id> <cite> <dl> <dt> <dd> <a hreflang href> <blockquote cite> <ul type> <ol start type> <strong> <em> <code> <li> <img src alt data-entity-uuid data-entity-type height width data-caption data-align> <drupal-diagram data-diagram-uuid data-align>'
              filter_html_help: false
              filter_html_nofollow: false
        - instance_id: divengine_diagram_embed
          configuration:
            id: divengine_diagram_embed
            provider: divengine_diagram_embed
            status: true
            weight: 100
            settings: {}
    filter.format.full_html:
      setFilterConfig:
        instance_id: divengine_diagram_embed
        configuration:
          id: divengine_diagram_embed
          provider: divengine_diagram_embed
          status: true
          weight: 100
          settings: {}
    editor.editor.basic_html:
      addItemToToolbar: divengineDiagram
    editor.editor.full_html:
      addItemToToolbar: divengineDiagram
    user.role.content_editor:
      grantPermissions:
        - 'access divengine'
        - 'view divengine reports'
        - 'use unified process'
        - 'view artifact'
        - 'create artifact'
        - 'edit artifact'
        - 'view artifact revisions'
        - 'view diagrams'
        - 'create diagrams'
        - 'edit own diagrams'
        - 'view diagram revisions'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'view trace link revisions'
        - 'use artifact_lifecycle transition create_new_draft'
        - 'use artifact_lifecycle transition submit_for_review'
        - 'use diagram_lifecycle transition create_new_draft'
        - 'use diagram_lifecycle transition submit_for_review'
        - 'view latest version'
        - 'use requirement_lifecycle transition draft'
        - 'use requirement_lifecycle transition propose'
        - 'use requirement_lifecycle transition approve'
        - 'use requirement_lifecycle transition baseline'
        - 'use requirement_lifecycle transition deprecate'
        - 'use use_case_lifecycle transition identify'
        - 'use use_case_lifecycle transition outline'
        - 'use use_case_lifecycle transition detail'
        - 'use use_case_lifecycle transition review'
        - 'use use_case_lifecycle transition baseline'
        - 'use use_case_lifecycle transition deprecate'
        - 'use work_product_lifecycle transition draft'
        - 'use work_product_lifecycle transition submit'
        - 'use work_product_lifecycle transition baseline'
        - 'use projects'
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'log time'
        - 'use qa'
    # Verification criteria of divengine_qa, after the cases are imported.
    divengine_process.development_case.standard:
      addLines: &qa_lines
        - element_type: readiness
          target: requirements_verified
          milestone_type: initial_operational_capability
          level: recommended
        - element_type: readiness
          target: use_cases_verified
          milestone_type: product_release
          level: recommended
        - element_type: readiness
          target: change_requests_evidenced
          level: recommended
    divengine_process.development_case.brownfield:
      addLines: *qa_lines
    # Test management roles, cumulative like their permissions.
    user.role.qa_user:
      createIfNotExists:
        label: 'QA User'
      grantPermissions:
        - 'access comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'use qa'
    user.role.qa_tester:
      createIfNotExists:
        label: 'QA Tester'
      grantPermissions:
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'use qa'
        - 'execute qa tests'
        - 'use text format qa_issue'
    user.role.qa_lead:
      createIfNotExists:
        label: 'QA Lead'
      grantPermissions:
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'use qa'
        - 'execute qa tests'
        - 'manage qa'
        - 'use text format qa_issue'
    user.role.qa_manager:
      createIfNotExists:
        label: 'QA Manager'
      grantPermissions:
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
        - 'access divengine'
        - 'use unified process'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'use qa'
        - 'execute qa tests'
        - 'manage qa'
        - 'administer qa'
        - 'use text format qa_issue'
    # Project management: content editors work on tasks (above); project
    # managers create projects and manage any project they see.
    user.role.project_manager:
      createIfNotExists:
        label: 'Project Manager'
      grantPermissions:
        - 'access divengine'
        - 'use projects'
        - 'manage projects'
        - 'log time'
        - 'manage timesheets'
        - 'view trace links'
        - 'create trace links'
        - 'edit trace links'
        - 'access comments'
        - 'post comments'
        - 'skip comment approval'
        - 'edit own comments'
