name: 'Divengine Studio MCP'
description: 'Exposes Studio to AI clients (claude.ai, Claude Code, Claude Desktop, Cursor) as a read-only MCP server with OAuth 2.1 and token authentication. Run "drush divengine:mcp-oauth-setup" afterwards to create the OAuth signing keys, and "drush divengine:mcp-setup" for the service account and its token.'
type: 'Integration'
install:
  - jsonapi
  - jsonapi_schema
  - key
  - mcp
  - divengine_mcp
  - divengine_mcp_oauth
  # Engineering writes (ADR-0019): available to nobody until an administrator
  # gives people the "MCP writer" role.
  - divengine_mcp_write
config:
  # Re-applying the recipe keeps what the site already has.
  strict: false
  # Recipes only install simple config from modules; the OAuth token types
  # (simple_oauth) and the "mcp" scope (divengine_mcp_oauth) are config
  # entities and have to be imported explicitly.
  import:
    simple_oauth: '*'
    divengine_mcp_oauth: '*'
    divengine_mcp_write: '*'
  actions:
    # Ownership of mcp.settings (ADR-0016). The recipe is re-applied on
    # updates, so it only forces what the distribution owns:
    # - enable_auth is always put back to true. Until divengine:mcp-setup
    #   runs, only users with a session and the "use mcp server" permission
    #   can reach /mcp/post.
    # - auth_settings belongs to divengine:mcp-setup and is never set here;
    #   the mcp module treats missing values as off.
    # - plugins are defaults: simpleConfigDefaults (divengine_mcp) adds the
    #   plugins a site does not have yet and keeps what administrators set.
    mcp.settings:
      simpleConfigUpdate:
        enable_auth: true
      simpleConfigDefaults:
        plugins.general:
          enabled: true
          config: {}
        plugins.content:
          enabled: true
          config:
            content_types:
              article: article
              page: page
        plugins.jsonapi:
          enabled: true
          config:
            allowed_resource_types: []
        # Code of the Developments the agent can see (divengine_source).
        plugins.code:
          enabled: true
          config: {}
        # Database schemas of the Developments the agent can see
        # (divengine_database).
        plugins.database:
          enabled: true
          config: {}
        plugins.codedocs:
          enabled: true
          config: {}
        # Engineering writes: listed only to OAuth tokens with the
        # mcp_write scope of people with the "MCP writer" role.
        plugins.engineering:
          enabled: true
          config: {}
    # Read-only: the MCP plugins enabled here only read, and the service
    # account gets no write permissions.
    user.role.mcp_agent:
      createIfNotExists:
        label: 'MCP agent'
      grantPermissions:
        - 'use mcp server'
        - 'access content'
        - 'access divengine'
        - 'view divengine reports'
        - 'view artifact'
        - 'view artifact revisions'
        - 'view diagrams'
        - 'view diagram revisions'
        - 'view trace links'
        - 'view trace link revisions'
        - 'use unified process'
        - 'use source code'
        - 'use database schemas'
        - 'use code docs'
    # People who may connect an AI client to their own account with OAuth
    # (ADR-0017). The token can only do what both the person and the
    # "MCP agent" role can do, so it never writes.
    user.role.mcp_user:
      createIfNotExists:
        label: 'MCP user'
      grantPermissions:
        - 'use mcp server'
        - 'grant simple_oauth codes'
    # The role of the "mcp_write" scope (ADR-0019). A token can do what both
    # its person and this role can do; the tools themselves only create and
    # revise requirements, decisions and evidence, register external work
    # and link or unlink them, and never approve.
    user.role.mcp_editor:
      createIfNotExists:
        label: 'MCP editor (scope)'
      grantPermissions:
        - 'use mcp server'
        - 'write engineering records through mcp'
        - 'access divengine'
        - 'use unified process'
        - 'view artifact'
        - 'view artifact revisions'
        - 'view latest version'
        - 'create artifact'
        - 'edit artifact'
        - 'create requirement artifact'
        - 'edit requirement artifact'
        - 'create decision artifact'
        - 'edit decision artifact'
        - 'create evidence artifact'
        - 'edit evidence artifact'
        - 'view trace links'
        - 'view trace link revisions'
        - 'create trace links'
        - 'delete trace links'
        - 'link external work'
        - 'use requirement_lifecycle transition draft'
        - 'use requirement_lifecycle transition propose'
        - 'use artifact_lifecycle transition create_new_draft'
        - 'use artifact_lifecycle transition submit_for_review'
        - 'use artifact_lifecycle transition request_changes'
    # People whose AI clients may write. They still need the ordinary
    # permissions of each write (for example Content editor) and "MCP user".
    user.role.mcp_writer:
      createIfNotExists:
        label: 'MCP writer'
      grantPermissions:
        - 'write engineering records through mcp'
